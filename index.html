<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Drills</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            background: #f4f4f4;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 32px;
        }

        #todayDate {
            font-size: 18px;
            color: #555;
        }

        /* Main layout */

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Tiles */

        .tile {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .tile h2 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 22px;
        }

        .tile p {
            line-height: 1.5;
        }

        /* Buttons */

        .button {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 16px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
        }

        .button:hover {
            background: #555;
        }

        /* Daily Video */

        .video-name {
            font-size: 20px;
            font-weight: bold;
            margin: 12px 0 5px;
        }

        .daily-message {
            color: #666;
            font-style: italic;
        }

        /* 3-Drill Rotation */

        .drill-name {
            font-size: 20px;
            font-weight: bold;
            margin: 12px 0 5px;
        }

        /* Legal Term */

        .legal-term {
            font-size: 25px;
            font-weight: bold;
            margin: 12px 0 10px;
        }

        .legal-definition {
            line-height: 1.5;
            margin: 0;
        }

        .legal-week {
            font-size: 14px;
            color: #777;
            margin-top: 14px;
        }

        .legal-source {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }

        .legal-source a {
            color: #666;
        }

        /* On This Day */

        .history-event {
            display: grid;
            grid-template-columns: 55px 1fr;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5e5;
        }

        .history-event:first-child {
            padding-top: 5px;
        }

        .history-date {
            font-weight: bold;
            font-size: 16px;
        }

        .history-sentence {
            line-height: 1.45;
        }

        .history-link {
            margin-top: 18px;
        }

        .history-link a {
            color: #333;
            font-weight: bold;
        }

        /* BMAC */

        .bmac {
            margin-top: 20px;
        }

        .bmac img {
            display: block;
        }

        /* Mobile */

        @media (max-width: 700px) {

            body {
                padding: 20px 15px;
            }

            .page-header {
                flex-direction: column;
                gap: 5px;
            }

            .page-header h1 {
                font-size: 28px;
            }

            #todayDate {
                font-size: 16px;
            }

            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- HEADER -->

    <div class="page-header">
        <h1>Daily Drills</h1>
        <div id="todayDate"></div>
    </div>


    <!-- MAIN CONTENT -->

    <div class="main-grid">

        <!-- LEFT COLUMN -->

        <div class="left-column">

            <!-- DAILY VIDEO -->

            <div class="tile">
                <h2>Daily Video</h2>

                <div id="dailyVideo"></div>
            </div>


            <!-- 3-DRILL ROTATION -->

            <div class="tile">
                <h2>3-Drill Rotation</h2>

                <p>
                    One drill each day. The rotation continues automatically.
                </p>

                <div id="rotatingDrill"></div>
            </div>


            <!-- LEGAL TERM OF THE WEEK -->

            <div class="tile">
                <h2>Legal Term of the Week</h2>

                <div id="legalTerm">
                    <p class="daily-message">
                        Loading this week's legal term...
                    </p>
                </div>
            </div>


            <!-- BMAC BUTTON -->

            <div class="bmac">

                <a href="https://www.buymeacoffee.com/vanessacr" target="_blank">
                    <img
                        src="https://cdn.buymeacoffee.com/buttons/v2/default-blue.png"
                        alt="Buy Me a Coffee"
                        style="height: 60px !important;width: 217px !important;"
                    >
                </a>

            </div>

        </div>


        <!-- RIGHT COLUMN -->

        <div class="tile">

            <h2>On This Day</h2>

            <div id="onThisDay">

                <p class="daily-message">
                    Loading today's historical events...
                </p>

            </div>

        </div>

    </div>

</div>


<script>

    /* =========================================================
       DATE
       ========================================================= */

    function displayTodayDate() {

        const today = new Date();

        const formattedDate = today.toLocaleDateString("en-US", {
            month: "long",
            day: "numeric",
            year: "numeric"
        });

        document.getElementById("todayDate").textContent =
            formattedDate;
    }



    /* =========================================================
       DAILY VIDEO
       Monday-Friday only
       ========================================================= */

    const dailyVideos = {

        Monday:
            "https://www.youtube.com/watch?v=E7F8B352_sk",

        Tuesday:
            "https://www.youtube.com/watch?v=aMn53B1KtFk",

        Wednesday:
            "https://www.youtube.com/watch?v=kmdA-WqLn34",

        Thursday:
            "https://www.youtube.com/watch?v=_Rga7Hs8QjA",

        Friday:
            "https://www.youtube.com/watch?v=nO--0GOjSZ8"
    };


    function displayDailyVideo() {

        const container =
            document.getElementById("dailyVideo");

        const today = new Date();

        const dayName = today.toLocaleDateString("en-US", {
            weekday: "long"
        });


        if (!dailyVideos[dayName]) {

            container.innerHTML = `
                <p class="daily-message">
                    No daily video on Saturday or Sunday.
                </p>
            `;

            return;
        }


        container.innerHTML = `

            <div class="video-name">
                ${dayName}'s Video
            </div>

            <a
                class="button"
                href="${dailyVideos[dayName]}"
                target="_blank"
                rel="noopener noreferrer"
            >
                Open Daily Video
            </a>

        `;
    }



    /* =========================================================
       3-DRILL ROTATION

       September 10, 2026 = Alphabet
       September 11, 2026 = Letter
       September 12, 2026 = Number

       Then repeats.
       ========================================================= */

    const rotatingDrills = {

        Alphabet:
            "https://www.youtube.com/watch?v=t7F9mzdxCis",

        Letter:
            "https://www.youtube.com/watch?v=agc2LbxKa9U",

        Number:
            "https://www.youtube.com/watch?v=RJAKSweYwHM"
    };


    function displayRotatingDrill() {

        const container =
            document.getElementById("rotatingDrill");

        const today = new Date();

        const startDate =
            new Date(2026, 8, 10);

        startDate.setHours(0, 0, 0, 0);

        today.setHours(0, 0, 0, 0);


        const millisecondsPerDay =
            1000 * 60 * 60 * 24;


        const daysSinceStart =
            Math.floor(
                (today - startDate) /
                millisecondsPerDay
            );


        const drillNames = [
            "Alphabet",
            "Letter",
            "Number"
        ];


        const index =
            ((daysSinceStart % 3) + 3) % 3;


        const drillName =
            drillNames[index];


        const drillURL =
            rotatingDrills[drillName];


        container.innerHTML = `

            <div class="drill-name">
                ${drillName} Drill
            </div>

            <a
                class="button"
                href="${drillURL}"
                target="_blank"
                rel="noopener noreferrer"
            >
                Open ${drillName} Drill
            </a>

        `;
    }



    /* =========================================================
       LEGAL TERM OF THE WEEK

       Source:
       Showalter's Law Dictionary

       The dictionary is CC0/public domain.

       The page chooses ONE entry every Monday and
       keeps that same entry for the entire week.

       September 7, 2026 is the starting Monday.
       ========================================================= */


    const dictionaryBase =
        "https://raw.githubusercontent.com/michaeljshowalter/showalters-law-dictionary/main/";


    const dictionaryLetters =
        "ABCDEFGHIJKLMNOPQRSTUVWYZ";


    function getMonday(date) {

        const result =
            new Date(date);

        result.setHours(0, 0, 0, 0);

        const day =
            result.getDay();


        const difference =
            day === 0
                ? -6
                : 1 - day;


        result.setDate(
            result.getDate() + difference
        );


        return result;
    }


    function getWeekNumber(monday) {

        const firstMonday =
            new Date(2026, 8, 7);

        firstMonday.setHours(0, 0, 0, 0);


        const millisecondsPerWeek =
            1000 * 60 * 60 * 24 * 7;


        return Math.floor(
            (monday - firstMonday) /
            millisecondsPerWeek
        );
    }


    function formatWeek(monday) {

        const sunday =
            new Date(monday);

        sunday.setDate(
            sunday.getDate() + 6
        );


        const start =
            monday.toLocaleDateString(
                "en-US",
                {
                    month: "short",
                    day: "numeric"
                }
            );


        const end =
            sunday.toLocaleDateString(
                "en-US",
                {
                    month: "short",
                    day: "numeric"
                }
            );


        return `${start}–${end}`;
    }


    function cleanDefinition(text) {

        /*
            Remove the status line.
        */

        text =
            text.replace(
                /^_Status:[^\n]*\n?/i,
                ""
            );


        /*
            Remove NOTE material.
        */

        const noteIndex =
            text.indexOf("[NOTE:");

        if (noteIndex !== -1) {

            text =
                text.substring(
                    0,
                    noteIndex
                );
        }


        /*
            Remove "See also" material.
        */

        const seeAlsoIndex =
            text.indexOf("See also");

        if (seeAlsoIndex !== -1) {

            text =
                text.substring(
                    0,
                    seeAlsoIndex
                );
        }


        /*
            Remove Markdown formatting.
        */

        text =
            text.replace(
                /\*\*/g,
                ""
            );

        text =
            text.replace(
                /_/g,
                ""
            );


        /*
            Collapse whitespace.
        */

        text =
            text.replace(
                /\s+/g,
                " "
            )
            .trim();


        /*
            Remove quotation marks at the beginning/end.
        */

        text =
            text.replace(
                /^["“]+/,
                ""
            );

        text =
            text.replace(
                /["”]+$/,
                ""
            );


        /*
            Find the first complete sentence.

            This keeps the display much shorter than
            the full dictionary entry.
        */

        const sentenceMatch =
            text.match(
                /^(.{20,300}?[.!?])(?:\s|$)/
            );


        if (sentenceMatch) {

            text =
                sentenceMatch[1];
        }


        /*
            If the first sentence is still too long,
            shorten it at a word boundary.
        */

        if (text.length > 240) {

            text =
                text.substring(
                    0,
                    237
                ).replace(
                    /\s+\S*$/,
                    ""
                ) + "...";
        }


        return text;
    }


    function parseDictionary(markdown) {

        const entries = [];

        const headingPattern =
            /^## (.+)$/gm;


        const headings =
            [...markdown.matchAll(
                headingPattern
            )];


        for (
            let i = 0;
            i < headings.length;
            i++
        ) {

            const term =
                headings[i][1].trim();


            const start =
                headings[i].index +
                headings[i][0].length;


            const end =
                i + 1 < headings.length
                    ? headings[i + 1].index
                    : markdown.length;


            let definition =
                markdown.substring(
                    start,
                    end
                ).trim();


            definition =
                cleanDefinition(
                    definition
                );


            if (
                term &&
                definition &&
                !term.startsWith("See ")
            ) {

                entries.push({
                    term: term,
                    definition: definition
                });
            }
        }


        return entries;
    }


    async function displayLegalTerm() {

        const container =
            document.getElementById("legalTerm");


        const today =
            new Date();


        const monday =
            getMonday(today);


        const weekNumber =
            getWeekNumber(monday);


        /*
            Cycle through the available letters.

            There is no X file with entries, so X is
            skipped.
        */

        const letters =
            "ABCDEFGHIJKLMNOPQRSTUVWYZ";


        const letter =
            letters[
                ((weekNumber % letters.length)
                + letters.length)
                % letters.length
            ];


        const url =
            dictionaryBase +
            letter +
            ".md";


        try {

            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    `Dictionary request failed: ${response.status}`
                );
            }


            const markdown =
                await response.text();


            const entries =
                parseDictionary(
                    markdown
                );


            if (!entries.length) {

                throw new Error(
                    "No legal terms found."
                );
            }


            /*
                Use the Monday's week number to
                deterministically select one entry.

                The same week will therefore always
                show the same term.
            */

            const entryIndex =
                (
                    weekNumber * 7
                ) % entries.length;


            const entry =
                entries[entryIndex];


            const week =
                formatWeek(monday);


            container.innerHTML = `

                <div class="legal-term">
                    ${entry.term}
                </div>

                <p class="legal-definition">
                    ${entry.definition}
                </p>

                <div class="legal-week">
                    ${week}
                </div>

                <div class="legal-source">
                    Source:
                    <a
                        href="https://github.com/michaeljshowalter/showalters-law-dictionary"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Showalter's Law Dictionary
                    </a>
                </div>

            `;

        } catch (error) {

            console.error(
                "Legal dictionary error:",
                error
            );


            container.innerHTML = `

                <p class="daily-message">
                    Unable to load this week's legal term.
                </p>

            `;
        }
    }



    /* =========================================================
       ON THIS DAY

       Uses Wikimedia's public On This Day feed.
       ========================================================= */

    async function displayOnThisDay() {

        const container =
            document.getElementById("onThisDay");


        const today =
            new Date();


        const month =
            String(
                today.getMonth() + 1
            ).padStart(2, "0");


        const day =
            String(
                today.getDate()
            ).padStart(2, "0");


        const url =
            `https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/events/${month}/${day}`;


        try {

            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    `Request failed: ${response.status}`
                );
            }


            const data =
                await response.json();


            if (
                !data.events ||
                !data.events.length
            ) {

                container.innerHTML = `

                    <p class="daily-message">
                        No historical events found for today.
                    </p>

                `;

                return;
            }


            const events =
                data.events.slice(0, 8);


            let html = "";


            events.forEach(event => {

                html += `

                    <div class="history-event">

                        <div class="history-date">
                            ${event.year}
                        </div>

                        <div class="history-sentence">
                            ${event.text}
                        </div>

                    </div>

                `;
            });


            html += `

                <div class="history-link">

                    <a
                        href="https://en.wikipedia.org/wiki/Wikipedia:On_this_day"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        More On This Day
                    </a>

                </div>

            `;


            container.innerHTML =
                html;


        } catch (error) {

            container.innerHTML = `

                <p class="daily-message">
                    Unable to load today's historical events.
                </p>

            `;

            console.error(
                "On This Day error:",
                error
            );
        }
    }



    /* =========================================================
       START EVERYTHING
       ========================================================= */

    displayTodayDate();

    displayDailyVideo();

    displayRotatingDrill();

    displayLegalTerm();

    displayOnThisDay();

</script>

</body>
</html>
