const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""),I=["B-","D-","F-","G-","H-","J-","K-","L-","M-","N-","P-","Q-","R-","S-","T-","V-","W-","X-","Y-","Z-"],F=["-B","-D","-F","-G","-J","-K","-L","-M","-N","-P","-Q","-R","-S","-T","-V","-X","-Z"],V=["long A","short A","long E","short E","long I","short I","long O","short O","long U","short U","AO (too)","OU (how)","AU (saw)","OI (boy)"],N=Array.from({length:101},(_,i)=>""+i);let main="letters",sub="alphabet",numberMode="cardinal",timer,end,last="",paused=false,remaining=0,runStarted=0,runTotal=0,intervalMs=0,progressTimer=null,openingTimeout=null,shownItems=[];const item=document.getElementById("item"),blink=document.getElementById("blink"),subs=document.getElementById("subs");function ordinal(n){const j=n%10,k=n%100;let suf=(j===1&&k!==11)?"st":(j===2&&k!==12)?"nd":(j===3&&k!==13)?"rd":"th";return n+suf}
function pool(){if(main==="numbers")return numberMode==="ordinal"?N.map(x=>ordinal(+x)):N;if(main==="mixed")return [...I,...F,...V,...N];if(sub==="alphabet")return A;if(sub==="consonants")return [...I,...F];return [...I,...F,...V]}function next(){let p=pool(),n=p[Math.floor(Math.random()*p.length)];while(p.length>1&&n===last)n=p[Math.floor(Math.random()*p.length)];last=n;shownItems.push(n);renderItem(n)}function renderItem(n){

 if(!V.includes(n)){item.textContent=n;return}
 const match=n.match(/^(long|short) ([AEIOU])$/);

function renderReadback(){

 target.replaceChildren();
 const groups=[];
 for(let i=0;i<shownItems.length;i+=5)groups.push(shownItems.slice(i,i+5));
 const columns=groups.length<=16?1:groups.length<=32?2:3;
 const rows=Math.ceil(groups.length/columns);

 for(let col=0;col<columns;col++){
  const column=document.createElement("div");column.className="readback-column";

   const group=groups[col*rows+row];if(!group)continue;

   line.textContent=group.map(v=>v.replace(/^(AO|OU|AU|OI) \([^)]*\)$/,"$1")).join(", ");

function resetDrill(){

 shownItems=[];document.getElementById("readbackCard").hidden=true;

function updateProgress(){
 const elapsed=runTotal-remaining;
 document.getElementById("progressFill").style.width=Math.min(100,elapsed/runTotal*100)+"%";
 const sec=Math.ceil(remaining/1000);
 document.getElementById("timeLeft").textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
}
function finishRun(){
 clearTimeout(openingTimeout);clearInterval(timer);clearInterval(progressTimer);paused=false;remaining=0;
 document.getElementById("progressFill").style.width="100%";document.getElementById("timeLeft").textContent="0:00";
 blink.style.display="none";displayBox.classList.add("messageMode");item.classList.remove("vowel");item.textContent="Now read back!";startBtn.textContent="▶ Start";renderReadback();
}
function runTimers(){
 runStarted=Date.now();
 timer=setInterval(next,intervalMs);
 progressTimer=setInterval(()=>{
   const used=Date.now()-runStarted;runStarted=Date.now();remaining=Math.max(0,remaining-used);updateProgress();
   if(remaining<=0)finishRun();
 },100);
}

 }
 clearInterval(timer);clearInterval(progressTimer);clearTimeout(openingTimeout);shownItems=[];document.getElementById("readbackCard").hidden=true;displayBox.classList.remove("messageMode");
 blink.style.display="none";renderItem(pool()[0]);
 const sVal=+document.getElementById("speed").value,m=+document.getElementById("mins").value;
 intervalMs=60000/sVal;runTotal=m*60000;remaining=runTotal;
 document.getElementById("progressFill").style.width="0%";document.getElementById("timeLeft").textContent=m+":00";
 startBtn.textContent="⏸ Pause";
 next();runTimers();
};

r party who files a civil lawsuit."], ["Plea", "A defendant’s formal response to a criminal charge."], ["Plea bargain", "An agreement to resolve criminal charges without a trial."], ["Precedent", "An earlier court decision used as legal guidance."], ["Preliminary hearing", "A hearing to determine whether a criminal case may proceed."], ["Probable cause", "Reasonable grounds to believe a crime occurred or evidence exists."], ["Probate", "The legal process of handling a deceased person’s estate."], ["Pro se", "Representing oneself without a lawyer."], ["Prosecution", "The side bringing criminal charges."], ["Protective order", "A court order limiting certain conduct or disclosures."], ["Rebuttal", "Evidence or argument offered to answer the opposing side."], ["Record", "The official account of court proceedings and filed materials."], ["Redirect examination", "Questions asked by the original attorney after cross-examination."], ["Remand", "To send a case back to a lower court for further action."], ["Restitution", "Payment ordered to repay a victim for losses."], ["Restraining order", "A court order restricting someone’s actions."], ["Sentence", "The punishment imposed after a criminal conviction."], ["Settlement", "An agreement resolving a dispute without a final trial decision."], ["Sidebar", "A discussion with the judge outside the jury’s hearing."], ["Standard of proof", "The level of certainty required to prove a case."], ["Statute", "A law enacted by a legislative body."], ["Statute of limitations", "The deadline for bringing a legal claim or charge."], ["Stipulation", "A fact or procedure agreed upon by the parties."], ["Subpoena", "An order to appear or provide evidence."], ["Summary judgment", "A decision made without trial when no material factual dispute requires one."], ["Sustained", "A judge’s decision agreeing with an objection."], ["Testimony", "Statements given by a witness under oath."], ["Tort", "A civil wrong that may create legal liability."], ["Tr function showLegalTerm(){
 const now=new Date();
 // Anchor the rotation to Monday, October 5, 2026, in the viewer's local calendar.
 const todayUTC=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
 const weekStartUTC=todayUTC-((now.getDay()+6)%7)*86400000;
 const anchor=Date.UTC(2026,9,5);
 const weeks=Math.floor((weekStartUTC-anchor)/(7*86400000));
 const index=((weeks%legalTerms.length)+legalTerms.length)%legalTerms.length;
 document.getElementById("legalTerm").textContent=legalTerms[index][0];
 document.getElementById("legalDefinition").textContent=legalTerms[index][1];
}
showLegalTerm();

const eventsBox=document.getElementById("historyEvents");
function historyDayKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function stableHash(t){let h=2166136261;for(const c of t){h=Math.imul(h^c.charCodeAt(0),16777619)}return h>>>0}
async function showHistory(){
 const d=new Date(),mm=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");
 try{
   const url=`https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${mm}/${dd}`;
   const response=await fetch(url);
   if(!response.ok)throw new Error("Wikipedia unavailable");
   const data=await response.json();
   const candidates=(data.events||[]).filter(e=>Number.isInteger(e.year)&&e.year>=1&&e.year<=d.getFullYear()&&e.text);
   // Deterministic random sample for each date: same eight throughout the day.
   const key=historyDayKey(d);
   const shuffled=candidates.map(e=>({e,score:stableHash(key+"|"+e.year+"|"+e.text)})).sort((a,b)=>a.score-b.score);
   const selected=shuffled.slice(0,8).map(x=>x.e).sort((a,b)=>b.year-a.year);
   if(!selected.length)throw new Error("No events available");
   eventsBox.replaceChildren();
   for(const e of selected){
     const line=document.createElement("div");line.className="history-event";
     const yr=document.createElement("strong");yr.textContent=e.year+" CE";
     const body=document.createElement("span");body.textContent=e.text;
     line.append(yr,body);eventsBox.append(line);
   }
 }catch(err){eventsBox.textContent="Historical events are temporarily unavailable.";}
}
showHistory();
